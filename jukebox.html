<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Jukebox - De Eeuwige Verbouwing</title>
<style>
  :root { --bg: #14110e; --paneel: #1f1a15; --rand: #3a3027; --inkt: #ece6d6; --zacht: #a3998a; --licht: #f0c06a; --salie: #7e9c86; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--inkt); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; color: var(--licht); margin: 0 0 4px; letter-spacing: .04em; }
  p.uitleg { color: var(--zacht); margin: 0 0 20px; }
  .lied { display: flex; align-items: center; gap: 14px; background: var(--paneel); border: 1px solid var(--rand); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
  .lied:hover { border-color: var(--zacht); }
  .lied.speelt { border-color: var(--licht); box-shadow: 0 0 0 1px var(--licht) inset; }
  .knop { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--rand); display: grid; place-items: center; flex: none; color: var(--licht); font-size: 16px; }
  .lied.speelt .knop { background: var(--licht); color: var(--bg); }
  .tekst { flex: 1; min-width: 0; }
  .naam { font-weight: 600; }
  .waar { color: var(--zacht); font-size: 13px; }
  .bpm { color: var(--salie); font-size: 13px; font-variant-numeric: tabular-nums; flex: none; }
  .stop { margin-top: 12px; font: inherit; background: var(--paneel); color: var(--inkt); border: 1px solid var(--rand); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>JUKEBOX</h1>
  <p class="uitleg">Elk nummer zoals het in het spel klinkt: noten uit de MIDI van de plaat, gespeeld door de chip. Klik om te luisteren, nog eens om te stoppen.</p>
  <div id="lijst"></div>
  <button class="stop" id="stop">Stop</button>
</main>
<script type="module" src="/src/jukebox.ts"></script>
</body>
</html>
